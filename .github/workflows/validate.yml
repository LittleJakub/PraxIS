name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: pip install pyyaml
      - name: Manifest, frontmatter, links, inventory
        run: python scripts/check_repo.py
      - name: Calibration tables match data/*.csv
        run: python scripts/check_calibration.py
